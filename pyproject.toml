[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-latent-learning"
version = "0.1.0"
description = "Token-level T5 FactorVAE utilities for GoEmotions emotion translation experiments."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.4",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "huggingface-hub>=0.33.5",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "peft>=0.19.0",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "transformers>=5.5.4",
    "openai>=2.32.0",
    "nltk>=3.9.4",
    "spacy>=3.8.13",
    "sentence-transformers>=5.4.1",
    "pip>=26.0.1",
    "bert-score>=0.3.13",
    "nrclex>=4.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "seaborn>=0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
